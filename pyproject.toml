[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blinklane-review"
version = "0.1.0"
description = "Local Tesla Dashcam public preview reviewer for suspected lane changes without observed turn signals."
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "numpy>=2.0.0",
  "opencv-python-headless>=4.10.0.84",
  "python-multipart>=0.0.9",
]

# Installable extras:
#   .[dev]  — pytest, httpx, ruff. CI installs this set and does not download weights.
#   .[yolo] — ultralytics>=8.4 and torch>=2.5. Default weight file name is yolo26s.pt
#             (BLINKLANE_MODEL_NAME in backend/app/config.py). Do not fetch it in CI.
#   .[dev,yolo] — local full setup.

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]
yolo = [
  "ultralytics>=8.4.0",
  "torch>=2.5.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
