name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint backend
        run: python -m ruff check .
      # Mocked detector only. Do not add a job that downloads YOLO weights.
      - name: Analysis smoke (mocked detector, no YOLO weights)
        run: python -m pytest backend/tests/test_analysis_smoke.py -q
      - name: Test backend
        run: python -m pytest
      - name: Build frontend
        run: npm run build
